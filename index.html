            theme: {
                extend: {
                    colors: {
                        brand: {
                            red: '#9e1b1b',
                            redDark: '#781212',
                            bg: '#121212',
                            card: '#1c1c1e',
                            gold: '#d4af37',
                            goldLight: '#f3e5ab'

                        serif: ['"Playfair Display"', 'serif'],

    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .tab-active { color: #d4af37; border-bottom: 2px solid #d4af37; font-weight: 700; }

        /* Tava Yemekleri Özel Çerçeve Animasyonu */
        @keyframes flameGlow {
            0% { box-shadow: 0 0 8px rgba(255, 69, 0, 0.4); border-color: #ff4500; }
            50% { box-shadow: 0 0 20px rgba(255, 69, 0, 0.8), inset 0 0 10px rgba(255, 69, 0, 0.3); border-color: #ff8c00; }
            100% { box-shadow: 0 0 8px rgba(255, 69, 0, 0.4); border-color: #ff4500; }
        }

        .flame-card {
            animation: flameGlow 2s infinite alternate ease-in-out;
        }

        /* Şef ve Duman Animasyonları */
        @keyframes chefFloat {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-8px) rotate(1.5deg); }
        }

        @keyframes steamRise {
            0% { transform: translateY(0) scaleX(1); opacity: 0.8; }
            50% { transform: translateY(-10px) scaleX(1.3); opacity: 0.4; }
            100% { transform: translateY(-20px) scaleX(1.6); opacity: 0; }
        }

        @keyframes sparkleGlow {
            0%, 100% { opacity: 0.3; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1.2); }
        }

        .animate-chef {
            animation: chefFloat 3.5s ease-in-out infinite;
        }

        .animate-steam-1 { animation: steamRise 2.2s infinite linear; }
        .animate-steam-2 { animation: steamRise 2.2s infinite linear 0.7s; }
        .animate-steam-3 { animation: steamRise 2.2s infinite linear 1.4s; }

        .animate-sparkle {
            animation: sparkleGlow 2s infinite ease-in-out;
        }
    </style>

        function setLanguage(lang) {
            currentLang = lang;
            const t = uiTranslations[lang];

            document.getElementById('sub-tagline').innerText = t.tagline;
            document.getElementById('searchInput').placeholder = t.searchPlaceholder;
            
            document.getElementById('tab-makarnalar').innerText = t.tabs.makarnalar;
            document.getElementById('tab-tava').innerText = t.tabs.tava;
            document.getElementById('tab-salata').innerText = t.tabs.salata;
            document.getElementById('tab-ekstra').innerText = t.tabs.ekstra;
            document.getElementById('tab-icecekler').innerText = t.tabs.icecekler;

            document.getElementById('portion-title').innerText = t.portionTitle;
            document.getElementById('portion-half').innerText = t.portionHalf;
            document.getElementById('portion-15').innerText = t.portion15;
            document.getElementById('portion-double').innerText = t.portionDouble;

            document.getElementById('qr-btn-text').innerText = t.qrBtn;
            document.getElementById('qr-subtitle').innerText = t.qrSubtitle;
            document.getElementById('qr-footer-note').innerText = t.qrNote;

            if(lang === 'tr') {
                document.getElementById('lang-tr').className = "px-2.5 py-1 rounded-full transition bg-brand-gold text-black";
                document.getElementById('lang-en').className = "px-2.5 py-1 rounded-full transition text-gray-400 hover:text-white";
            } else {
                document.getElementById('lang-en').className = "px-2.5 py-1 rounded-full transition bg-brand-gold text-black";
                document.getElementById('lang-tr').className = "px-2.5 py-1 rounded-full transition text-gray-400 hover:text-white";
            }

            renderMenu(currentTab);
        }

        function renderMenu(category, searchFilter = '') {
            const container = document.getElementById('menuContainer');
            const portionBanner = document.getElementById('portionBanner');
            
            if (category === 'makarnalar' && !searchFilter) {
                portionBanner.classList.remove('hidden');
            } else {
                portionBanner.classList.add('hidden');
            }

            const items = menuData[currentLang][category] || [];
            const filteredItems = items.filter(item => 
                item.name.toLowerCase().includes(searchFilter.toLowerCase()) || 
                item.desc.toLowerCase().includes(searchFilter.toLowerCase())
            );

            if (filteredItems.length === 0) {
                container.innerHTML = `<div class="text-center py-12 text-gray-500 text-sm">${uiTranslations[currentLang].notFound}</div>`;
                return;
            }

            container.innerHTML = filteredItems.map(item => {
                if (item.image) {
                    const cardClass = item.isFlame 
                        ? "bg-brand-card border rounded-2xl overflow-hidden mb-4 flame-card shadow-lg flex flex-col" 
                        : "bg-brand-card border border-white/10 rounded-2xl overflow-hidden mb-4 shadow-sm hover:border-brand-gold/30 transition flex flex-col";
                    
                    return `
                        <div class="${cardClass}">
                            <div class="w-full h-44 overflow-hidden relative cursor-pointer group" onclick="openMediaModal('${item.name}', '${item.desc}', '${item.image}')">
                                <img src="${item.image}" alt="${item.name}" class="w-full h-full object-cover group-hover:scale-105 transition duration-500" onerror="this.onerror=null; this.src='https://via.placeholder.com/600x400/1c1c1e/d4af37?text=Gorsel+Bulunamadi';">
                                <div class="absolute bottom-2 right-2 bg-black/60 backdrop-blur-md text-white text-[10px] px-2 py-1 rounded-lg flex items-center gap-1 border border-white/10">
                                    <i data-lucide="maximize-2" class="w-3 h-3"></i> Büyüt
                                </div>
                            </div>
                            <div class="p-4 flex flex-col justify-between flex-1">
                                <div class="flex items-start justify-between gap-2 mb-2">
                                    <h3 class="font-bold text-base text-white font-serif tracking-wide">${item.name}</h3>
                                    <span class="bg-black/50 text-brand-gold font-bold text-sm px-3 py-1 rounded-xl border border-brand-gold/20 whitespace-nowrap">
                                        ${item.price} ₺
                                    </span>
                                </div>
                                <p class="text-xs text-gray-400 leading-relaxed">${item.desc}</p>
                            </div>
                        </div>
                    `;
                } else {
                    const rowClass = item.isFlame
                        ? "bg-brand-card border rounded-2xl p-4 mb-3 flex justify-between items-start gap-4 flame-card shadow-lg"
                        : "bg-brand-card border border-white/5 rounded-2xl p-4 mb-3 flex justify-between items-start gap-4 hover:border-brand-gold/30 transition shadow-sm";
                    
                    return `
                        <div class="${rowClass}">
                            <div class="flex-1">
                                <h3 class="font-bold text-base text-white font-serif tracking-wide">${item.name}</h3>
                                <p class="text-xs text-gray-400 mt-1 leading-relaxed">${item.desc}</p>
                            </div>
                            <div class="text-right">
                                <span class="inline-block bg-black/40 text-brand-gold font-bold text-sm px-3 py-1.5 rounded-xl border border-brand-gold/20 whitespace-nowrap">
                                    ${item.price} ₺
                                </span>
                            </div>
                        </div>
                    `;
                }
            }).join('');

            lucide.createIcons();
        }

        function openMediaModal(title, desc, image) {
            const modal = document.getElementById('mediaModal');
            const content = document.getElementById('mediaContent');
            document.getElementById('mediaTitle').innerText = title;
            document.getElementById('mediaDesc').innerText = desc;

            content.innerHTML = `<img src="${image}" alt="${title}" class="w-full h-full object-cover" onerror="this.onerror=null; this.src='https://via.placeholder.com/600x400/1c1c1e/d4af37?text=Gorsel+Bulunamadi';">`;
            modal.classList.remove('hidden');
        }

        function closeMediaModal() {
            document.getElementById('mediaModal').classList.add('hidden');
            document.getElementById('mediaContent').innerHTML = '';
        }

        function switchTab(tab) {
            currentTab = tab;
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('tab-active');
                btn.classList.add('text-gray-400');
            });
            const activeBtn = document.getElementById(`tab-${tab}`);
            if (activeBtn) {
                activeBtn.classList.add('tab-active');
                activeBtn.classList.remove('text-gray-400');
            }
            
            document.getElementById('searchInput').value = '';
            renderMenu(tab);
        }

        function filterItems() {
            const query = document.getElementById('searchInput').value;
            renderMenu(currentTab, query);
        }

        let qrGenerated = false;
        function openQRModal() {
            document.getElementById('qrModal').classList.remove('hidden');
            if (!qrGenerated) {
                new QRCode(document.getElementById("qrcode"), {
                    text: "https://mondoqrmenu.con.tc/Mondo/",
                    width: 160,
                    height: 160,
                    colorDark : "#000000",
                    colorLight : "#ffffff",
                    correctLevel : QRCode.CorrectLevel.H
                });
                qrGenerated = true;
            }
        }

        function closeQRModal() {
            document.getElementById('qrModal').classList.add('hidden');
        }

        document.addEventListener("DOMContentLoaded", () => {
            renderMenu('makarnalar');
            lucide.createIcons();
        });
    </script>
